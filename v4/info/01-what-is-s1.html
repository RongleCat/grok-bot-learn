<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>环境底座与思考模型拆分</title>
<style>
html,body{width:1200px;height:760px;margin:0;overflow:hidden}
*{box-sizing:border-box}
body{background:#fbf7ee;color:#171716;font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}
.page{height:760px;padding:38px 48px 50px;position:relative}
.hero{height:124px;position:relative;border-bottom:1px solid #d8d1c4}
h1{margin:0;font-size:34px;line-height:1.18;letter-spacing:-1.2px;font-weight:760}
.core{margin:16px 0 0;font-size:18px;line-height:1.5;font-weight:650}
.bot{position:absolute;right:8px;top:-10px;width:112px;height:112px;object-fit:contain}
.split{height:270px;margin-top:22px;display:grid;grid-template-columns:1fr 54px 1fr;align-items:stretch}
.card{border:1px solid #d8d1c4;border-radius:24px;background:#fffdf8;padding:25px 28px;position:relative}
.harness{border-top:5px solid #3972e8}
.brain{border-top:5px solid #db724d}
.eyebrow{margin:0 0 12px;font-size:17px;line-height:1.35;font-weight:760}
.card h2{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.5px}
.rule{height:1px;background:#ded7cb;margin:20px 0 17px}
.facts{margin:0;display:grid;gap:10px;font-size:18px;line-height:1.48}
.facts p{margin:0}
.facts strong{font-weight:760}
.connector{display:flex;align-items:center;justify-content:center;position:relative}
.connector:before{content:"";height:1px;width:100%;background:#cfc7bb;position:absolute}
.connector span{width:24px;height:24px;border-radius:50%;background:#171716;color:#fffdf8;z-index:1;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;font-family:Arial,sans-serif}
.comparison{height:222px;margin-top:22px;border:1px solid #d8d1c4;border-radius:24px;background:#fffdf8;overflow:hidden}
.comparison-head{height:54px;padding:16px 26px 0;font-size:18px;line-height:1.3;font-weight:760;border-bottom:1px solid #ded7cb}
.rows{height:168px;display:grid;grid-template-columns:1fr 1fr 1.16fr}
.row{padding:18px 22px;border-right:1px solid #ded7cb}
.row:last-child{border-right:0;background:#f2f6ff}
.tool{margin:0 0 10px;font-size:21px;line-height:1.25;font-weight:760}
.env{margin:0 0 8px;font-size:16px;line-height:1.3;color:#3d3b37}
.result{margin:0;font-size:16px;line-height:1.42;font-weight:620}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <h1>环境底座与思考模型拆分</h1>
    <p class="core">核心是把环境底座与思考模型拆分</p>
    <img class="bot" src="bots/cercle-bleu.png" alt="">
  </header>
  <section class="split" aria-label="底座与模型">
    <article class="card harness">
      <p class="eyebrow">底座（Harness）</p>
      <h2>常驻云端</h2>
      <div class="rule"></div>
      <div class="facts">
        <p>配有 <strong>Linux 终端、浏览器和持久文件</strong></p>
        <p><strong>关机合盖，后台任务照常跑</strong></p>
      </div>
    </article>
    <div class="connector" aria-hidden="true"><span>+</span></div>
    <article class="card brain">
      <p class="eyebrow">模型（Brain）</p>
      <h2>按需调度</h2>
      <div class="rule"></div>
      <div class="facts">
        <p>2026 年 10 月 7 日默认切为 <strong>Claude Opus 5.5</strong></p>
        <p>可派生 <strong>Cursor Agent 协同编码</strong></p>
      </div>
    </article>
  </section>
  <section class="comparison" aria-label="工具对比">
    <div class="comparison-head">运行环境　·　离线与协作</div>
    <div class="rows">
      <article class="row">
        <p class="tool">聊天助手</p>
        <p class="env">临时网页</p>
        <p class="result">关网页即断，单次对话</p>
      </article>
      <article class="row">
        <p class="tool">命令行 Agent</p>
        <p class="env">本地终端</p>
        <p class="result">退出即停，限本地仓库</p>
      </article>
      <article class="row">
        <p class="tool">Grok Bot</p>
        <p class="env">持久云电脑</p>
        <p class="result">关机仍运行，跨任务文件交接</p>
      </article>
    </div>
  </section>
</main>
</body>
</html>
