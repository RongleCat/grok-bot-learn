<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆与技能的边界</title>
<style>
*{box-sizing:border-box}html,body{width:1200px;height:760px;margin:0;overflow:hidden}body{background:#fff9f1;color:#1e1c1a;font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}.page{width:1200px;height:760px;padding:36px 48px 38px}.top{height:108px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ded6ca}.heading{display:flex;align-items:center;gap:24px}.bot{width:108px;height:108px;object-fit:contain}.eyebrow{font-size:16px;letter-spacing:.12em;color:#796f66;margin:0 0 8px}.title{font-size:34px;letter-spacing:-.045em;line-height:1.15;margin:0;font-weight:750}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}.card{height:166px;border:1px solid #ded6ca;border-radius:24px;background:#fffdf9;padding:21px 28px}.memory{border-top:5px solid #cf6e69}.skill{border-top:5px solid #578f89}.type{font-size:17px;letter-spacing:.1em;margin:0 0 18px;color:#71685f}.main{font-size:29px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.035em}.hint{font-size:16px;margin:11px 0 0;color:#635b54}.arrow{font-size:26px;line-height:1;color:#9a9188;margin:12px 0 0 6px}.section{height:180px;border:1px solid #ded6ca;border-radius:24px;background:#fffdf9;margin-top:10px;padding:17px 28px}.section h2{font-size:20px;line-height:1.25;margin:0 0 12px;letter-spacing:-.02em}.quote{display:grid;grid-template-columns:112px 1fr;gap:18px;align-items:stretch}.quote-label{background:#edf5f3;color:#34736c;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}.quote-text{font-size:17px;line-height:1.62;margin:0;padding:2px 0}.quote-text strong{font-weight:700;color:#34736c}.bottom{display:grid;grid-template-columns:1.16fr .84fr;gap:22px;margin-top:18px}.mini{height:128px;border:1px solid #ded6ca;border-radius:22px;background:#fffdf9;padding:15px 22px}.mini h2{font-size:17px;margin:0 0 8px;letter-spacing:.03em}.steps{display:flex;align-items:center;gap:9px;font-size:16px;white-space:nowrap}.step{border-radius:11px;background:#f4ede4;padding:7px 10px}.chev{color:#aa9d90;font-size:18px}.priority{font-size:17px;line-height:1.45;margin:0}.priority b{color:#b85350;font-weight:700}.rule{font-size:15px;color:#635b54;line-height:1.35;margin:5px 0 0}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="heading">
      <img class="bot" src="bots/goutte-rose.png" alt="">
      <div>
        
        <h1 class="title">记忆与技能的边界</h1>
      </div>
    </div>
  </header>
  <section class="comparison" aria-label="记忆与技能">
    <article class="card memory">
      <p class="type">记忆（周活降40%）</p>
      <p class="main">事实与偏好</p>
      <p class="hint">知道什么</p>
    </article>
    <article class="card skill">
      <p class="type">技能</p>
      <p class="main">流程与审批</p>
      <p class="hint">怎么做</p>
    </article>
  </section>
  <div class="arrow">↓</div>
  <section class="section" aria-label="好流程指令存为技能">
    <h2>好流程指令存为技能</h2>
    <div class="quote">
      <div class="quote-label">保存为技能</div>
      <p class="quote-text">将我们用于此任务的流程保存为名为<strong>“每周账户健康状况”</strong>的技能。<br>包括源系统、风险定义、输出格式，以及联系客户始终需要批准这条规则。</p>
    </div>
  </section>
  <section class="bottom">
    <article class="mini">
      <h2>屏幕演示三步走</h2>
      <div class="steps"><span class="step">1 对话开计算机视图</span><span class="chev">→</span><span class="step">2 选「教会任务」输结果</span><span class="chev">→</span><span class="step">3 屏幕演示</span></div>
      <p class="rule">限10分钟，不录麦克风与密码。超10分钟易失败，拆成短阶段串联。</p>
    </article>
    <article class="mini">
      <h2>排错优先级</h2>
      <p class="priority"><b>消除根源</b>　&gt;　测试校验　&gt;<br>专有规则　&gt;　改记忆</p>
      <p class="rule">团队技能由 Creator 或 Manager 发布，私聊只属个人。</p>
    </article>
  </section>
</main>
</body>
</html>
