<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{width:1200px;height:760px;margin:0;overflow:hidden}body{background:#fbf6ee;color:#24221f;font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}.page{width:1200px;height:760px;padding:42px 52px 38px}.head{height:102px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ded7cd}.head h1{margin:0;font-size:38px;letter-spacing:-1.3px;font-weight:760;line-height:1.15}.bot{width:104px;height:104px;object-fit:contain;margin:0 22px 0 20px}.compare{display:grid;grid-template-columns:1fr 74px 1fr;gap:14px;height:220px;margin-top:24px}.card{border:1px solid #ded7cd;border-radius:24px;background:#fffdf9;padding:23px 25px}.card h2{font-size:21px;margin:0 0 18px;font-weight:720}.poll{border-top:5px solid #d27647}.event{border-top:5px solid #7155aa}.steps{display:grid;gap:10px}.step{display:flex;align-items:center;gap:11px;font-size:17px;line-height:1.35}.dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#f5e5da;color:#a94f2e;font-size:14px;font-weight:750}.event .dot{background:#ede7f7;color:#624598}.arrow{display:flex;align-items:center;justify-content:center;font-size:42px;color:#8c8175}.contrast{font-size:18px;line-height:1.52;margin:18px 2px 0;text-align:center}.contrast strong{color:#634598}.lower{display:grid;grid-template-columns:1.24fr .76fr;gap:20px;margin-top:18px;height:252px}.flow{padding:21px 24px}.flow h2,.guard h2{margin:0 0 18px;font-size:21px;font-weight:720}.flowrow{display:flex;align-items:stretch;gap:9px}.node{width:154px;min-height:128px;border:1px solid #ded7cd;border-radius:19px;background:#fffdf9;padding:18px 13px;font-size:16px;line-height:1.45;display:flex;align-items:center;justify-content:center;text-align:center}.node strong{font-size:17px}.node.violet{background:#f4f0fa;border-color:#c9b9e5}.chev{align-self:center;flex:none;color:#7155aa;font-size:25px}.flow-note{margin:9px 3px 0;font-size:16px;line-height:1.45}.guard{padding:21px 24px;border-top:5px solid #7155aa}.guard ul{list-style:none;padding:0;margin:0;display:grid;gap:11px}.guard li{font-size:16px;line-height:1.35;padding-left:23px;position:relative}.guard li:before{content:"";position:absolute;left:0;top:5px;width:10px;height:10px;border:2px solid #7155aa;border-radius:50%}.small{font-size:15px;color:#5f5952}.em{color:#634598;font-weight:700}
</style>
</head>
<body>
<main class="page">
  <header class="head"><h1>从轮询走向被动唤醒</h1><img class="bot" src="bots/triangle-violet.png" alt=""></header>
  <section class="compare">
    <article class="card poll">
      <h2>定时轮询外部网页</h2>
      <div class="steps"><div class="step"><span class="dot">1</span><span>高频空转</span></div><div class="step"><span class="dot">2</span><span>极费额度</span></div><div class="step"><span class="dot">3</span><span>迅速耗尽整周算力</span></div></div>
    </article>
    <div class="arrow">→</div>
    <article class="card event">
      <h2>事件驱动唤醒 Bot</h2>
      <div class="steps"><div class="step"><span class="dot">1</span><span>平时彻底休眠</span></div><div class="step"><span class="dot">2</span><span>外部有变化</span></div><div class="step"><span class="dot">3</span><span>再被动触发</span></div></div>
    </article>
  </section>
  <p class="contrast">机械判断交给本地脚本，<strong>需要动脑才叫醒大模型</strong>。</p>
  <section class="lower">
    <article class="card flow">
      <h2>Webhook：差异唤醒</h2>
      <div class="flowrow"><div class="node">定时比对<br><span class="small">网页哈希值 / PR 数</span></div><div class="chev">›</div><div class="node violet"><strong>发现实质变动</strong></div><div class="chev">›</div><div class="node">向 Webhook<br>发起 POST 调用</div><div class="chev">›</div><div class="node violet">Bot 醒来后<br>开始处置</div></div>
      <p class="flow-note">脚本耗时几秒且不消耗 Grok 订阅额度。</p>
    </article>
    <aside class="card guard">
      <h2>Slack：防爆额度</h2>
      <ul><li><span class="em">必须绑定单一专属频道</span></li><li>过滤条件尽量收紧</li><li>不要监听其他频道</li><li><span class="em">严禁在公共频道监听任意消息</span></li><li>只对创建后的新消息生效</li></ul>
    </aside>
  </section>
</main>
</body>
</html>
