<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一次好的交接</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 760px; margin: 0; overflow: hidden; }
  body {
    background: #f8f7f3;
    color: #1d1c1a;
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  main { width: 1200px; height: 760px; padding: 48px 58px 42px; }
  .heading { height: 120px; position: relative; }
  h1 { margin: 0; font-size: 38px; line-height: 1.18; letter-spacing: -1.2px; font-weight: 760; }
  .intro { margin: 15px 0 0; font-size: 18px; line-height: 1.6; color: #55504a; }
  .bot { position: absolute; right: 5px; top: -14px; width: 112px; height: 112px; object-fit: contain; }
  .flow {
    height: 386px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    align-items: stretch;
  }
  .step {
    position: relative;
    background: #fffefd;
    border: 1px solid #e3dfd8;
    border-radius: 24px;
    padding: 26px 20px 22px;
    display: flex;
    flex-direction: column;
  }
  .step:not(:last-child)::after {
    content: "";
    position: absolute;
    z-index: 2;
    top: 50%;
    right: -13px;
    width: 10px;
    height: 10px;
    border-top: 2px solid #e05b42;
    border-right: 2px solid #e05b42;
    transform: rotate(45deg);
    background: #f8f7f3;
  }
  .num { color: #e05b42; font-size: 16px; line-height: 1; font-weight: 760; letter-spacing: .08em; }
  h2 { margin: 19px 0 15px; font-size: 21px; line-height: 1.3; letter-spacing: -.4px; font-weight: 740; }
  .rule { width: 32px; height: 3px; border-radius: 99px; background: #1d1c1a; margin-bottom: 18px; }
  .copy { margin: 0; color: #59544e; font-size: 16px; line-height: 1.72; }
  .result {
    height: 128px;
    margin-top: 26px;
    border-radius: 24px;
    border: 1px solid #e3dfd8;
    background: #1d1c1a;
    color: #fffdf8;
    display: flex;
    align-items: center;
    padding: 24px 30px;
  }
  .result-mark { color: #f09a82; font-size: 16px; font-weight: 700; letter-spacing: .12em; margin-right: 27px; }
  .result strong { font-size: 27px; letter-spacing: -.5px; font-weight: 720; }
  .result span { margin-left: 22px; color: #d7d1c9; font-size: 16px; }
</style>
</head>
<body>
<main>
  <section class="heading">
    <h1>一次好的交接</h1>
    <p class="intro">你发出的每一条消息，本质上都是一次工作交接。</p>
    <img class="bot" src="bots/galet-rouge.png" alt="">
  </section>
  <section class="flow" aria-label="好请求的五要素">
    <article class="step">
      <div class="num">01</div>
      <h2>目标与具体动作</h2>
      <div class="rule"></div>
      <p class="copy">动作必须落到具体的操作动词上。</p>
    </article>
    <article class="step">
      <div class="num">02</div>
      <h2>信息来源与<br>访问范围</h2>
      <div class="rule"></div>
      <p class="copy">交代清楚从哪里获取数据，同时明确排除哪些区域。</p>
    </article>
    <article class="step">
      <div class="num">03</div>
      <h2>决策边界与<br>审批红线</h2>
      <div class="rule"></div>
      <p class="copy">哪些步骤可以全自动执行，哪些步骤绝对不能越界。</p>
    </article>
    <article class="step">
      <div class="num">04</div>
      <h2>交付形态与<br>存放路径</h2>
      <div class="rule"></div>
      <p class="copy">最终要交出什么格式的成果，存放在什么位置。</p>
    </article>
    <article class="step">
      <div class="num">05</div>
      <h2>事实与推测分离<br>及异常处理</h2>
      <div class="rule"></div>
      <p class="copy">将直接客观事实与推导出的判断严格区分开。</p>
    </article>
  </section>
  <section class="result">
    <div class="result-mark">做完怎么验收</div>
    <strong>能够直接验收的交付物</strong>
    <span>记录具体错误并继续执行剩余项目</span>
  </section>
</main>
</body>
</html>
