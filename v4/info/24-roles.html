<style>

h:7px;height:7px;border-top:2px solid #22a69a;border-right:2px solid #22a69a;transform:rotate(45deg)}.gate{padding:22px 26px;display:grid;grid-template-columns:1fr 38px 1fr;align-items:stretch;gap:18px}.lane{border-radius:20px;padding:18px 20px}.lane.safe{background:#f3fbfa;border:1px solid #b9ddd9}.lane.stop{background:#fff6f2;border:1px solid #f0c9bb}.lane h3{font-size:20px;margin:0 0 10px}.lane p{font-size:15px;line-height:1.6;margin:0}.divider{display:flex;align-items:center;justify-content:center;color:#a65745;font-size:26px;font-weight:500}.human{margin-top:12px;display:inline-block;background:#e98267;color:#fff;border-radius:999px;padding:5px 13px;font-size:15px;font-weight:750}.gate-title{position:absolute}.mini{font-size:15px;color:#5f6862;margin-top:3px}

<body>
<main class="page">
<h1 class="title">按岗位组建你的 AI 团队</h1>
<img class="bot" src="bots/nuage-turquoise.png" alt="">
<section class="context"><strong>同一个账号下</strong><span class="dot"></span><span>共享同一台云端电脑</span><span class="dot"></span><span>每个 Bot 拥有独立的上下文记忆和对话线程</span></section>
<div class="layout">
<section class="signals card">
<div class="eyebrow">先划定边界</div>
<h2>出现任一信号<br>设立独立的专职 Bot</h2>
<div class="signal-list">
<div class="signal"><i></i>目标不同</div>
<div class="signal"><i></i>工具不同</div>
<div class="signal"><i></i>工作风格不同</div>
<div class="signal"><i></i>审批边界不同</div>
<div class="signal"><i></i>日程安排不同</div>
</div>
</section>
<div class="right">
<section class="team card">
<span class="arrow"></span>
<div class="team-head"><div><div class="eyebrow">一个任务配置一套 Bot</div><h2>专职专岗 Bot 团队</h2></div><span>清晰单一，负责可重复交付的确定成果</span></div>
<div class="roles">
<div class="role">内容</div><div class="role">工程</div><div class="role">销售</div><div class="role">研究</div><div class="role">运营</div><div class="role">个人助理</div>
</div>
</section>
<section class="gate card">
<div class="lane safe"><div class="eyebrow">可逆的操作</div><h3>自主完成并记录日志</h3><p>起草文档、对账、打标签<br>提取摘要、搜集背景资料</p></div>
<div class="divider">→</div>
<div class="lane stop"><div class="eyebrow" style="color:#a65745">不可逆的操作</div><h3>执行前停下来</h3><p>对外发信、公开发布、合并代码<br>划扣资金、修改生产环境警报</p><span class="human">等待人类点击批准</span></div>
</section>
</div>
</div>
</main>
</body>
